[project]
name = "verity"
version = "0.1.0"
description = "An agentic equity analyst with a fact-checker, built on SEC XBRL data"
requires-python = ">=3.11"
dependencies = ["requests>=2.31", "pandas>=2.2", "PyYAML>=6.0", "yfinance>=0.2.50"]

[project.scripts]
verity = "verity.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
